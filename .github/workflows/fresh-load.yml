name: Fresh-load guard

# Runs the authoritative "a fresh pull must load on first boot" check on every
# push and pull_request to main. Mirrors what api.php does on a cold start
# (valid JSON + registry + config + task schema + api.php syntax). Fails the
# build if a fresh clone would break, so a bad schema/data commit can't ship.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fresh-load:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Fresh-pull schema/data guard
        run: php scripts/fresh_load_check.php .
